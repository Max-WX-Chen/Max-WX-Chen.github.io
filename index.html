<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Chen</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f2ec;
      --text: #18212f;
      --muted: #687385;
      --accent: #1967d2;
      --accent-dark: #0f3d87;
      --line: rgba(24, 33, 47, 0.16);
      --panel: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(25, 103, 210, 0.14), transparent 34rem),
        linear-gradient(135deg, #f5f2ec 0%, #edf3f8 48%, #f8f8f5 100%);
    }

    .page {
      width: min(1040px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 0 40px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 8px 0;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    a:hover {
      color: var(--accent-dark);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
      gap: 48px;
      align-items: center;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(44px, 8vw, 88px);
      line-height: 1;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 0 0 32px;
      color: var(--muted);
      font-size: clamp(18px, 2.6vw, 24px);
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      backdrop-filter: blur(12px);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .notes {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .notes h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .notes ul {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
    }

    footer {
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      header,
      main {
        display: block;
      }

      nav {
        margin-top: 16px;
      }

      main {
        padding: 48px 0;
      }

      .notes {
        margin-top: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Max Chen</div>
      <nav aria-label="主导航">
        <a href="/blog/">Blog</a>
        <a href="/archives/">Archives</a>
        <a href="/about/">About</a>
      </nav>
    </header>

    <main>
      <section>
        <h1 id="hi,-i'm-max.">Hi, I'm Max.</h1>
        <p class="lead">
          这里是我的个人主页。我会在这里整理项目、学习记录和一些技术文章。
        </p>
        <div class="actions">
          <a class="button primary" href="/blog/">进入 Blog</a>
          <a class="button" href="https://github.com/Max-WX-Chen">GitHub</a>
        </div>
      </section>

      <aside class="notes" aria-label="网站内容">
        <h2>现在这里会放什么</h2>
        <ul>
          <li>编程学习笔记</li>
          <li>项目记录与复盘</li>
          <li>个人经历与联系方式</li>
        </ul>
      </aside>
    </main>

    <footer>
      <span>Built with Hexo. Blog lives at /blog/.</span>
    </footer>
  </div>
</body>
</html>
