<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Chen</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f2ec;
      --text: #18212f;
      --muted: #687385;
      --accent: #1967d2;
      --accent-dark: #0f3d87;
      --line: rgba(24, 33, 47, 0.16);
      --panel: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(25, 103, 210, 0.14), transparent 34rem),
        linear-gradient(135deg, #f5f2ec 0%, #edf3f8 48%, #f8f8f5 100%);
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0 40px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 8px 0;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    nav {
      display: flex;
      gap: clamp(18px, 3vw, 34px);
      flex-wrap: wrap;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 650;
    }

    a:hover {
      color: var(--accent-dark);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: clamp(36px, 7vw, 84px);
      align-items: center;
      padding: 64px 0 56px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(44px, 8vw, 88px);
      line-height: 1;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 0 0 32px;
      color: var(--muted);
      font-size: clamp(18px, 2.6vw, 24px);
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      backdrop-filter: blur(12px);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .profile {
      display: grid;
      justify-items: center;
      gap: 20px;
    }

    .avatar-frame {
      width: min(360px, 100%);
      aspect-ratio: 1;
      padding: 0;
      border: 8px solid rgba(219, 234, 254, 0.92);
      border-radius: 50%;
      background: #eaf4ff;
      box-shadow:
        0 24px 70px rgba(24, 33, 47, 0.18),
        0 0 0 1px rgba(25, 103, 210, 0.18);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      background: #fff;
    }

    .profile-caption {
      max-width: 320px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }

    .profile-caption strong {
      color: var(--text);
      font-weight: 750;
    }

    footer {
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      header,
      main {
        display: block;
      }

      nav {
        margin-top: 16px;
      }

      main {
        padding: 48px 0;
      }

      .profile {
        margin-top: 42px;
      }

      .avatar-frame {
        width: min(300px, 82vw);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Max Chen</div>
      <nav aria-label="主导航">
        <a href="/blog/">Blog</a>
        <a href="/archives/">Archives</a>
        <a href="/about/">About</a>
      </nav>
    </header>

    <main>
      <section>
        <h1 id="hi,-i'm-max.">Hi, I'm Max.</h1>
        <p class="lead">
          这里是我的个人主页。我会在这里整理项目、学习记录和一些技术文章。
        </p>
        <div class="actions">
          <a class="button primary" href="/blog/">进入 Blog</a>
          <a class="button" href="https://github.com/Max-WX-Chen">GitHub</a>
        </div>
      </section>

      <aside class="profile" aria-label="个人头像">
        <div class="avatar-frame">
          <img src="/img/profile.jpg" alt="Max Chen 的头像">
        </div>
        <p class="profile-caption">
          <strong>Personal notes and ideas</strong><br>
          Blog, projects, and learning records.
        </p>
      </aside>
    </main>

    <footer>
      <span>Built with Hexo. Blog lives at /blog/.</span>
    </footer>
  </div>
</body>
</html>
